# Edição diária: coleta final, seleção, extração, redação com IA e montagem dos .docx.
# Inicia 06:13 BRT (09:13 UTC) para ter folga contra atrasos do agendador do GitHub.
# O próprio pipeline para de redigir às 10:00 BRT; os .docx são entregues em seguida
# (antes das 10:30) num Pull Request "edicao/AAAA-MM-DD" para revisão humana.
name: Edição diária

on:
  schedule:
    - cron: "13 9 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: "Backends de redação, em ordem (ex.: claude-cli,gemini)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scitekvision-dados
  cancel-in-progress: false

jobs:
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    env:
      TZ: America/Sao_Paulo
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Instalar Claude Code (redação com a assinatura Claude)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Gerar edição
        run: |
          EDICAO=$(python -c "from scitekvision.config import carregar; print(carregar().edicao_atual())")
          echo "EDICAO=$EDICAO" >> "$GITHUB_ENV"
          ARGS=""
          if [ -n "${{ inputs.backend }}" ]; then ARGS="--backend ${{ inputs.backend }}"; fi
          python -m scitekvision edicao --edicao "$EDICAO" $ARGS
      - name: Publicar rascunhos em Pull Request para revisão
        if: always() && env.EDICAO != ''
        run: |
          git config user.name "scitekvision-bot"
          git config user.email "scitekvision-bot@users.noreply.github.com"
          RAMO="edicao/${EDICAO}"
          git checkout -B "$RAMO"
          git add dados/candidatos "edicoes/${EDICAO}"
          git commit -m "edição ${EDICAO}: rascunhos para revisão" || exit 0
          git push -f origin "$RAMO"
          if ! gh pr view "$RAMO" >/dev/null 2>&1; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$RAMO" \
              --title "Edição ${EDICAO} — rascunhos para revisão" \
              --body-file "edicoes/${EDICAO}/LEIA-ME-REVISAO.md"
          fi
      - name: Anexar .docx ao resumo da execução
        if: always() && env.EDICAO != ''
        uses: actions/upload-artifact@v4
        with:
          name: scitekvision-${{ env.EDICAO }}
          path: edicoes/${{ env.EDICAO }}/**/*.docx
          if-no-files-found: ignore
