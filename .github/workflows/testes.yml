name: Testes

on:
  push:
    paths: ["scitekvision/**", "tests/**", "config/**", "prompts/**", "requirements.txt"]
  pull_request:
    paths: ["scitekvision/**", "tests/**", "config/**", "prompts/**", "requirements.txt"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
